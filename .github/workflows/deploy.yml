name: Build & deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Set repository variable CUSTOM_DOMAIN=true (Settings > Secrets and variables > Actions > Variables)
      # only when orlandosignsservices.com is ready to move from Wix to GitHub Pages.
      - run: node build.js
        env:
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
          BASE_PATH: ${{ vars.CUSTOM_DOMAIN == 'true' && '' || '/oss-website' }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
